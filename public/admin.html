<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1224"><title>Admin — TopUpKita</title><style>
:root{color-scheme:dark;--bg:#0d1224;--panel:#171e35;--line:#2a3555;--muted:#9aa7c4;--accent:#8b7cff;--good:#48d6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#20284a 0,transparent 35%),var(--bg);color:#f4f6ff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}a{color:#b8b0ff;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--accent)}button{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#293451}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0f162b;color:white;margin:7px 0 16px}label{display:block;color:#cbd3e8}.panel,.stat{background:rgba(23,30,53,.94);border:1px solid var(--line);border-radius:16px;padding:22px}.login{max-width:420px;margin:10vh auto}.muted{color:var(--muted)}.error{color:#ff9d9d;min-height:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}td{font-size:14px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#293451;color:#dce3ff;font-size:12px}.actions{display:flex;gap:10px;align-items:center}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:20px 14px}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="/">TopUp<span>Kita</span> / Admin</a><div class="actions" id="topActions" hidden><button class="secondary" id="refresh">Muat ulang</button><button id="logout">Keluar</button></div></header>
<section class="panel login" id="loginPanel"><h1>Login Admin</h1><p class="muted">Masuk untuk mengelola dan memantau pesanan.</p><form id="loginForm"><label>Email admin<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Masuk dashboard</button><p class="error" id="loginError"></p></form></section>
<section id="dashboard" hidden><h1>Dashboard</h1><p class="muted">Ringkasan transaksi dan daftar pesanan terbaru.</p><div class="stats"><div class="stat"><small>Total pesanan</small><strong id="totalOrders">—</strong></div><div class="stat"><small>Total nominal pesanan</small><strong id="gross">—</strong></div><div class="stat"><small>Pelanggan</small><strong id="customers">—</strong></div></div><section class="panel"><h2>Pesanan terbaru</h2><p class="muted" id="tableMsg">Memuat data…</p><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Produk</th><th>Tujuan</th><th>Pelanggan</th><th>Nominal</th><th>Status</th><th>Tanggal</th><th>Aksi Admin</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section></section></div>
<script>
const $=s=>document.querySelector(s);const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}
function showDashboard(on){$('#loginPanel').hidden=on;$('#dashboard').hidden=!on;$('#topActions').hidden=!on}
async function load(){try{const [s,o]=await Promise.all([api('/api/admin/summary'),api('/api/admin/orders')]);$('#totalOrders').textContent=s.orders.total;$('#gross').textContent=rupiah(s.orders.gross);$('#customers').textContent=s.customers;$('#tableMsg').textContent=o.orders.length?'':'Belum ada pesanan.';$('#ordersBody').innerHTML=o.orders.map(x=>'<tr><td>'+esc(x.invoice)+'</td><td>'+esc(x.product_name)+'</td><td>'+esc(x.target)+'</td><td>'+esc(x.email)+'</td><td>'+rupiah(x.amount)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td>'+esc(x.created_at)+'</td><td><select aria-label="Ubah status" data-invoice="'+esc(x.invoice)+'"><option value="WAITING_PAYMENT" '+(x.status==='WAITING_PAYMENT'?'selected':'')+'>Menunggu Pembayaran</option><option value="PAYMENT_REPORTED" '+(x.status==='PAYMENT_REPORTED'?'selected':'')+'>Pelanggan Mengaku Sudah Bayar</option><option value="PAID" '+(x.status==='PAID'?'selected':'')+'>Pembayaran Terverifikasi</option><option value="PROCESSING" '+(x.status==='PROCESSING'?'selected':'')+'>Sedang Diproses</option><option value="SUCCESS" '+(x.status==='SUCCESS'?'selected':'')+'>Berhasil</option><option value="FAILED" '+(x.status==='FAILED'?'selected':'')+'>Gagal</option></select></td></tr>').join('')}catch(e){if(e.message.includes('login')||e.message.includes('Akses'))showDashboard(false);$('#tableMsg').textContent=e.message}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';const f=new FormData(e.currentTarget);try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});if(d.user.role!=='admin'){await api('/api/auth/logout',{method:'POST'});throw Error('Akun ini bukan admin.')}showDashboard(true);await load()}catch(err){$('#loginError').textContent=err.message}});
$('#ordersBody').onchange=async e=>{if(!e.target.matches('select[data-invoice]'))return;try{await api('/api/admin/orders/'+encodeURIComponent(e.target.dataset.invoice)+'/status',{method:'PATCH',body:JSON.stringify({status:e.target.value})});await load()}catch(err){alert(err.message);await load()}};
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});showDashboard(false)};$('#refresh').onclick=load;
(async()=>{try{const d=await api('/api/me');if(d.user?.role==='admin'){showDashboard(true);await load()}}catch{}})();
</script></body></html>
